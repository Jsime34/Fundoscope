name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: fundoscope
          POSTGRES_PASSWORD: fundoscope
          POSTGRES_DB: fundoscope
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fundoscope -d fundoscope"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://fundoscope:fundoscope@localhost:5432/fundoscope
      FUNDOSCOPE_REQUIRE_DB: "1"  # the database tests must run here, not be skipped
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Architecture rules
        run: uv run lint-imports
      - name: Tests
        run: uv run pytest --cov=fundoscope --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
