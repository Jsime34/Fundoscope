[project]
name = "fundoscope"
version = "0.1.0"
description = "Satellite crop monitoring and parcel due diligence for coastal Peru"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "geoalchemy2>=0.15",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "geopandas>=1.0",
    "shapely>=2.1",
    "pyproj>=3.6",
    "sentinelhub>=3.11",
    "openeo>=0.30",
    "defusedxml>=0.7",
    # openeo (>=0.48) requires pandas < 3, and pandas 2.x triggers NumPy 2.5's "generic
    # timedelta unit" deprecation. Lift both caps once openeo supports pandas 3.
    "numpy>=2.0,<2.5",
    "pandas>=2.2,<3",
    "scipy>=1.13",
    "matplotlib>=3.8",
]

[project.scripts]
fundoscope = "fundoscope.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx2>=2.13",
    "ruff>=0.6",
    "ipykernel>=6",
    "nbstripout>=0.7",
    "import-linter>=2.1",
    "pytest-cov>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fundoscope"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
# Any warning fails the tests, so deprecations are fixed when they appear, not later.
filterwarnings = ["error"]

# --- Architecture rules, checked by `uv run lint-imports` (see docs/architecture.md) ---
[tool.importlinter]
root_package = "fundoscope"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: interfaces -> pipeline -> domain -> adapters -> config"
type = "layers"
layers = [
    "fundoscope.api | fundoscope.cli",
    "fundoscope.pipeline",
    "fundoscope.analysis | fundoscope.valley",
    "fundoscope.ml",
    "fundoscope.timeseries | fundoscope.ingest",
    "fundoscope.sentinel | fundoscope.db",
    "fundoscope.config",
]

[[tool.importlinter.contracts]]
name = "Domain modules are pure: no database, network, or web framework"
type = "forbidden"
source_modules = [
    "fundoscope.ingest",
    "fundoscope.timeseries",
    "fundoscope.ml",
    "fundoscope.analysis",
    "fundoscope.valley",
]
forbidden_modules = [
    "fundoscope.db",
    "fundoscope.sentinel",
    "fundoscope.pipeline",
    "fundoscope.api",
    "fundoscope.cli",
    "sqlalchemy",
    "geoalchemy2",
    "psycopg",
    "sentinelhub",
    "openeo",
    "fastapi",
]
